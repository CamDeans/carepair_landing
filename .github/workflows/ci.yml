# Use this workflow when this folder is the Git repository root (standalone landing repo).
# Do not copy the monorepo root .github/workflows/ci.yml here — that one expects mobile/ and server/.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
